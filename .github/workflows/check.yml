name: Check and build classroom web
on:
  push:
    branches: [main, teaching, testing]
  pull_request:
    branches: [main, teaching, testing]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: china-puzzle-${{ github.ref_name }}-${{ github.sha }}
          path: dist-web/
          retention-days: 14
